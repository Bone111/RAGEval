<!DOCTYPE html>
<html>
<head>
    <title>前端Token检查</title>
</head>
<body>
    <h1>前端Token状态检查</h1>
    <div id="result"></div>
    
    <script>
        function checkTokenStatus() {
            const result = document.getElementById('result');
            
            // 检查localStorage中的token
            const accessToken = localStorage.getItem('access_token');
            const tokenType = localStorage.getItem('token_type');
            const userInfo = localStorage.getItem('user_info');
            
            let html = '<h2>Token存储状态:</h2>';
            html += `<p><strong>access_token:</strong> ${accessToken ? accessToken.substring(0, 50) + '...' : '未找到'}</p>`;
            html += `<p><strong>token_type:</strong> ${tokenType || '未找到'}</p>`;
            html += `<p><strong>user_info:</strong> ${userInfo ? '已存储' : '未找到'}</p>`;
            
            if (accessToken) {
                // 尝试解析JWT token
                try {
                    const parts = accessToken.split('.');
                    if (parts.length === 3) {
                        const payload = JSON.parse(atob(parts[1]));
                        html += '<h2>Token内容:</h2>';
                        html += `<p><strong>用户ID:</strong> ${payload.sub}</p>`;
                        html += `<p><strong>过期时间:</strong> ${new Date(payload.exp * 1000).toLocaleString()}</p>`;
                        html += `<p><strong>是否过期:</strong> ${payload.exp * 1000 < Date.now() ? '是' : '否'}</p>`;
                    }
                } catch (e) {
                    html += '<p><strong>Token解析失败:</strong> ' + e.message + '</p>';
                }
                
                // 测试API请求
                html += '<h2>API测试:</h2>';
                html += '<p>正在测试API请求...</p>';
                
                fetch('/api/v1/user-configs/model-configs', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    html += `<p><strong>API响应状态:</strong> ${response.status}</p>`;
                    return response.json();
                })
                .then(data => {
                    html += `<p><strong>返回数据:</strong> 找到 ${data.length} 个模型配置</p>`;
                    result.innerHTML = html;
                })
                .catch(error => {
                    html += `<p><strong>API请求失败:</strong> ${error.message}</p>`;
                    result.innerHTML = html;
                });
            } else {
                html += '<h2>建议:</h2>';
                html += '<p>没有找到access_token，请先登录获取token</p>';
                result.innerHTML = html;
            }
        }
        
        // 页面加载后执行检查
        window.onload = checkTokenStatus;
    </script>
</body>
</html>
