[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation"
version = "1.0.0"
description = "RAG Evaluation System"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "celery[redis]>=5.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.2.0",
    "pydantic>=2.11.0",
    "python-jose>=3.4.0",
    "passlib>=1.7.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "alembic>=1.15.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "numpy>=2.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "llama-index-core>=0.12.0,<0.13.0",
    "llama-index>=0.12.0,<0.13.0",
]

[tool.setuptools.packages.find]
where = ["rag-evaluation-backend"]

[tool.pytest.ini_options]
testpaths = ["rag-evaluation-backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]
